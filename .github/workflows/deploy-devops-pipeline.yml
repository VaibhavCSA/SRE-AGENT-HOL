name: Deploy grubify-mini (SRE lab)
on:
  workflow_dispatch:
    inputs:
      simulate_crash:
        description: "Ship a build that crash-loops on startup"
        type: boolean
        default: false

env:
  RESOURCE_GROUP: SRE-agent-DevOps-pipeline
  CONTAINERAPP_NAME: ca-grubify-mini
  REGISTRY: acrsredevops.azurecr.io
  IMAGE: grubify-mini

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name ${{ env.REGISTRY }}

      - name: Build and push image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }} .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINERAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }} \
            --set-env-vars SIMULATE_CRASH=${{ inputs.simulate_crash }}
